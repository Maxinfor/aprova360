<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APROVAÇÃO 360</title>
    <style>
        :root { --bg-main: #060814; --bg-sidebar: #0b0f19; --primary: #3b82f6; }
        body { margin: 0; display: flex; height: 100vh; overflow: hidden; font-family: sans-serif; background: var(--bg-main); }
        
        /* LAYOUT RESPONSIVO */
        .left { width: 300px; background: var(--bg-sidebar); border-right: 1px solid #222f47; overflow-y: auto; padding: 20px; }
        .right { flex: 1; overflow-y: auto; padding: 40px; }

        /* Mágica para o celular */
        @media (max-width: 850px) {
            body { flex-direction: column; }
            .left { width: 100%; height: auto; max-height: 30vh; border-right: none; border-bottom: 2px solid var(--primary); }
            .right { padding: 20px; }
        }

        /* Ajuste para os cards não ficarem gigantes no PC */
        .card, .hero-banner { max-width: 900px; margin-left: auto; margin-right: auto; }
        
        /* Ajuste de botões para mobile */
        button { cursor: pointer; }
    </style>
</head>
<body>
    <div class="left">
        </div>
    <div class="right">
        </div>
</body>
</html>
