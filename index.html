<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APROVAÇÃO 360 - Mobile</title>
    <style>
        :root {
            --bg-main: #060814;
            --bg-sidebar: #0b0f19;
            --bg-card: #13192b;
            --bg-input: #090d16;
            --border-color: #222f47;
            --primary: #3b82f6;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg-main);
            color: var(--text-main);
            display: block; /* Ajuste para mobile: empilhamento */
            height: 100%;
        }

        /* SIDEBAR (Header no Mobile) */
        .left {
            width: 100%;
            background: var(--bg-sidebar);
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .input-group { display: flex; gap: 8px; margin-top: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: white; }
        
        button {
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            min-height: 44px; /* Otimizado para toque */
        }

        /* PAINEL PRINCIPAL */
        .right {
            padding: 16px;
        }

        .materia-body-content {
            display: grid;
            grid-template-columns: 1fr; /* Força 1 coluna no mobile */
            gap: 16px;
        }

        .card { background: var(--bg-card); padding: 16px; border-radius: 12px; margin-bottom: 16px; }

        /* Ajuste para telas grandes (Desktop) */
        @media (min-width: 768px) {
            body { display: flex; height: 100vh; overflow: hidden; }
            .left { width: 300px; height: 100vh; overflow-y: auto; border-bottom: none; border-right: 1px solid var(--border-color); }
            .right { flex: 1; overflow-y: auto; padding: 40px; }
            .materia-body-content { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="left">
        <h3>🚀 APROVAÇÃO 360</h3>
        <div class="input-group">
            <input id="discName" placeholder="Nova disciplina...">
            <button onclick="addDisc()">➕</button>
        </div>
        </div>

    <div class="right">
        <h1>Bem-vindo ao Aprovacao 360</h1>
        <p>Selecione ou crie uma disciplina para começar.</p>
        </div>

    <script>
        // Mantenha aqui a sua lógica de JavaScript original
        function addDisc() { alert("Funcionalidade de adicionar disciplina"); }
    </script>
</body>
</html>
