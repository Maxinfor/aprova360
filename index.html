<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APROVAÇÃO 360</title>
    <style>
        :root {
            --bg-main: #060814;
            --bg-sidebar: #0b0f19;
            --bg-card: #13192b;
            --text-main: #f1f5f9;
            --primary: #3b82f6;
            --danger: #f43f5e;
        }
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout Mobile */
        @media (max-width: 768px) { body { flex-direction: column; } }
        
        .left { width: 300px; background: var(--bg-sidebar); padding: 20px; overflow-y: auto; border-right: 1px solid #222f47; }
        @media (max-width: 768px) { .left { width: 100%; height: 30%; border-right: none; border-bottom: 1px solid #222f47; } }
        
        .right { flex: 1; padding: 20px; overflow-y: auto; }
        
        input, button { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; cursor: pointer; }
        .disc-btn { text-align: left; background: #1e293b; border: none; }
        .disc-btn.active { background: var(--primary); }
        .card { background: var(--bg-card); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .timer { font-family: monospace; font-size: 1.8rem; color: #10b981; margin: 10px 0; }
    </style>
</head>
<body>

<div class="left">
    <h3>🚀 APROVAÇÃO 360</h3>
    <input id="discName" placeholder="Nome da Disciplina">
    <button onclick="addDisc()">Adicionar Disciplina</button>
    <div id="discList"></div>
    <button onclick="exportData()" style="margin-top:20px; background:#10b981;">💾 Salvar Estado</button>
</div>

<div class="right" id="content">
    <h1>Bem-vindo</h1>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('aprovacao360')) || [];
    let currentDiscIndex = 0;

    function renderDiscs() {
        const list = document.getElementById('discList');
        list.innerHTML = '';
        data.forEach((d, i) => {
            const btn = document.createElement('button');
            btn.className = `disc-btn ${i === currentDiscIndex ? 'active' : ''}`;
            btn.innerText = d.name;
            btn.onclick = () => { currentDiscIndex = i; renderView(); };
            list.appendChild(btn);
        });
    }

    function addDisc() {
        const name = document.getElementById('discName').value;
        if(name) {
            data.push({ name: name, materias: [] });
            localStorage.setItem('aprovacao360', JSON.stringify(data));
            renderDiscs();
            renderView();
        }
    }

    function renderView() {
        const content = document.getElementById('content');
        const d = data[currentDiscIndex];
        if(!d) return;
        
        content.innerHTML = `<h2>${d.name}</h2><button onclick="addMateria()">+ Nova Matéria</button><div id="matList"></div>`;
        d.materias.forEach((m, i) => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<h3>${m.titulo}</h3><div class="timer" id="timer-${i}">00:00:00</div><button onclick="startTimer(${i})">Iniciar</button><button onclick="deleteMat(${i})" style="background:var(--danger)">Excluir</button>`;
            document.getElementById('matList').appendChild(div);
        });
    }

    function addMateria() {
        const titulo = prompt("Nome da matéria:");
        if(titulo) {
            data[currentDiscIndex].materias.push({ titulo, segundos: 0 });
            localStorage.setItem('aprovacao360', JSON.stringify(data));
            renderView();
        }
    }

    function deleteMat(i) {
        data[currentDiscIndex].materias.splice(i, 1);
        localStorage.setItem('aprovacao360', JSON.stringify(data));
        renderView();
    }

    function startTimer(i) {
        setInterval(() => {
            data[currentDiscIndex].materias[i].segundos++;
            let s = data[currentDiscIndex].materias[i].segundos;
            let h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
            document.getElementById(`timer-${i}`).innerText = 
                `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }, 1000);
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'meus_estudos.json';
        a.click();
    }

    renderDiscs();
    if(data.length > 0) renderView();
</script>

</body>
</html>
